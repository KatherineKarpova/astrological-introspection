services:
  - type: web
    name: astrological-introspection
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: astrological-introspection
          property: host
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Configure a hosted OpenAI-compatible endpoint in the dashboard.
      # A Render container cannot reach Ollama running on your computer.
      - key: AI_BASE_URL
        value: ""
      - key: AI_MODEL
        value: ""
